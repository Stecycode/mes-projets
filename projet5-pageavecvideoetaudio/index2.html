<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    .divG {
        max-width:800px;
        margin: auto;
        background-color: black;
        padding: 10px;
    }
    #A {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
    
    }
    #titre{
        text-align: center;
        width: 100%;
        margin:auto;
        color: beige;
        margin-bottom: 15px;
        font-size: 30px;
    
    }
    #chaine{
        color: beige;
        font-weight: 800;
    }
    #desc{
        color: beige;
        background-color: rgb(38, 38, 38);
        padding: 10px;
        border-radius: 8px;
        display: inline-block;
        font-size: 18px;
    }
    .Vues{
        display: flex;
        color: gray;
        gap:10px;
        font-size: 14px;
        margin-top: 10px;
    }
    .Button{
        display: flex;
        gap:10px;
        margin-top: 10px;

    }
    .D{
        background-color: rgb(57, 56, 56);
        border: none;
        border-radius:20px;
        padding: 12px;

    }
    .I{
        width: 45px;
        height: 45px;
        border-radius: 50px;
    }
    .divI{
        display: flex;
        align-items: center;
        gap:10px;
    }
    #ab{
        color: rgb(141, 141, 139);
        font-size: 12px;

    }
    .sab{
        background-color: red;
        color: bisque;
        border: none;
        border-radius: 20px;
        padding: 10px;
        margin-left: auto;
        font-weight: bold;
    }

    
    </style>
    <title>Document</title>
</head>
<body>
    
    <div class="divG">
        <h1 id="titre">Big Buck Bunny</h1>
        <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls id="A"></video>
        <div class="divI">
          <img class="I" src="    https://www.w3schools.com/howto/img_avatar.png" alt=""> 
          <div>
            <p id="chaine">Ma chaine</p>
            <P id="ab">1,2K abonnés</P>
          </div>
          <button class="sab">S'abonner</button>
        </div>
        <div class="Button">
          <button class="D">👍</button>
          <button class="D">👎</button>
          <button class="D">↗</button>
        </div>
        <p id="desc">petite vidéo de démonstration</p>
        <div class="Vues">
          <P>1245 Vues</P>
          <p>6 Septembre 2026</p>
        </div>
        
    </div>
    
</body>
</html>
